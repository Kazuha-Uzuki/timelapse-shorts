name: build

on:
  push:
    branches: [main]
  release:
    types: [published] # GitHub の画面で Release を公開したとき
  workflow_dispatch:
    inputs:
      screenshots:
        description: "画面の画像をログに出す（見た目の確認用）"
        type: boolean
        default: false

permissions:
  contents: write # Release に zip を付けるため

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: アプリをビルド（.NET同梱の単一exe）
        run: >
          dotnet publish src/TimelapseShorts.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -o dist

      - name: exe の名前の情報を表示（エクスプローラーのプロパティやタスクマネージャーに出る名前）
        shell: pwsh
        run: |
          $v = (Get-Item dist\TimelapseShorts.exe).VersionInfo
          Write-Host "製品名: $($v.ProductName) / ファイルの説明: $($v.FileDescription)"

      - name: LGPL版 FFmpeg を取得
        shell: pwsh
        run: |
          # 安定版ブランチの最新（例: ffmpeg-n8.0-latest-win64-lgpl-8.0.zip）を選ぶ。無ければ master 版。
          $names = gh release view latest -R BtbN/FFmpeg-Builds --json assets --jq '.assets[].name'
          $stable = $names | Where-Object { $_ -match '^ffmpeg-n([\d.]+)-latest-win64-lgpl-[\d.]+\.zip$' } |
                    Sort-Object { [version]($_ -replace '^ffmpeg-n([\d.]+)-.*$', '$1') } | Select-Object -Last 1
          $asset = if ($stable) { $stable } else { 'ffmpeg-master-latest-win64-lgpl.zip' }
          Write-Host "使用する FFmpeg: $asset"
          gh release download latest -R BtbN/FFmpeg-Builds -p $asset -O ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $root = Get-ChildItem ffmpeg -Directory | Select-Object -First 1
          Copy-Item "$($root.FullName)\bin\ffmpeg.exe", "$($root.FullName)\bin\ffprobe.exe" dist\
          Copy-Item "$($root.FullName)\LICENSE.txt" dist\FFmpeg-LICENSE.txt
          "FFmpeg: $asset`r`nSource: https://github.com/BtbN/FFmpeg-Builds / https://ffmpeg.org/download.html" |
            Out-File dist\FFmpeg-SOURCE.txt -Encoding utf8

      - name: エンコーダーの確認と試し書き
        shell: pwsh
        run: |
          $enc = & dist\ffmpeg.exe -hide_banner -encoders
          foreach ($e in 'h264_nvenc','h264_qsv','h264_amf','h264_mf','libopenh264') {
            $ok = [bool]($enc | Select-String -SimpleMatch " $e ")
            Write-Host ("{0,-12} {1}" -f $e, $(if ($ok) { '含まれている' } else { '含まれていない' }))
          }
          # このランナーにGPUは無いので、CPU側の代替エンコーダーが実際に動くか確認する
          $worked = $false
          foreach ($e in 'h264_mf','libopenh264') {
            & dist\ffmpeg.exe -hide_banner -loglevel error -f lavfi -i "testsrc2=s=1920x1080:r=30:d=2" `
              -vf "crop='min(iw,ih*9/16)':'min(ih,iw*16/9)',scale=1080:1920" -c:v $e -b:v 10M -f null -
            if ($LASTEXITCODE -eq 0) { Write-Host "$e で試し書き成功"; $worked = $true } else { Write-Host "$e は使えない" }
          }
          if (-not $worked) { throw "GPUが無いPC向けの代替エンコーダーが動きません" }

      - name: 文字入れ用の Google Fonts を同梱（OFL ライセンス文も一緒に）
        shell: pwsh
        run: |
          $commit = 'bbda7253fc363238b05d97515ca71f8ae49c4fa9' # google/fonts のこの版に固定する
          $fonts = 'zenmarugothic/ZenMaruGothic-Bold.ttf', 'zenkakugothicnew/ZenKakuGothicNew-Bold.ttf',
                   'delagothicone/DelaGothicOne-Regular.ttf', 'kiwimaru/KiwiMaru-Medium.ttf',
                   'shipporimincho/ShipporiMincho-Bold.ttf', 'kleeone/KleeOne-SemiBold.ttf',
                   'yuseimagic/YuseiMagic-Regular.ttf', 'hachimarupop/HachiMaruPop-Regular.ttf',
                   'dotgothic16/DotGothic16-Regular.ttf'
          New-Item -ItemType Directory dist\fonts\licenses -Force | Out-Null
          foreach ($p in $fonts) {
            $family, $file = $p -split '/'
            $base = "https://raw.githubusercontent.com/google/fonts/$commit/ofl"
            Invoke-WebRequest "$base/$p" -OutFile "dist\fonts\$file"
            Invoke-WebRequest "$base/$family/OFL.txt" -OutFile "dist\fonts\licenses\$($file -replace '\.ttf$', '')-OFL.txt"
          }
          Get-ChildItem dist\fonts -Recurse -File | ForEach-Object { "{0,10:N0}  {1}" -f $_.Length, $_.Name }

      - name: Windows 上で実際に変換して確かめる（画面・BGM・テキスト・フォント・プレビュー）
        shell: pwsh
        env:
          WINCHECK_SHOTS: ${{ inputs.screenshots && '1' || '0' }}
        run: |
          dotnet build tests/WinCheck/WinCheck.csproj -c Release -o wincheck
          Copy-Item dist\ffmpeg.exe, dist\ffprobe.exe wincheck\
          Copy-Item dist\fonts wincheck\fonts -Recurse
          & wincheck\WinCheck.exe
          if ($LASTEXITCODE -ne 0) { throw "変換のテストに失敗しました" }

      - name: zip にまとめる
        shell: pwsh
        run: |
          # 日本語のファイル名は解凍ソフトによって文字化けするので、英字の名前で入れる
          Copy-Item "使い方.txt" dist\README.txt
          Compress-Archive dist\* TimelapseShorts-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TimelapseShorts-win64
          path: TimelapseShorts-win64.zip

      - name: Release に zip を付ける（Release を公開したときだけ）
        if: github.event_name == 'release'
        run: gh release upload "$env:TAG" TimelapseShorts-win64.zip --clobber
        env:
          TAG: ${{ github.event.release.tag_name }}
